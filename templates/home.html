{% extends 'base.html' %}
{% block content %}
<h1>All Blog Posts</h1>
{% for post in posts %}
    <div class="post">
        <h2><a href="{{ url_for('view_post', post_id=post.id) }}">{{ post.title }}</a></h2>
        <p>{{ post.content[:150] }}...</p>
        <small>Posted on {{ post.date_posted.strftime('%Y-%m-%d') }}</small>
    </div>
{% else %}
    <p>No posts yet.</p>
{% endfor %}
{% endblock %}
