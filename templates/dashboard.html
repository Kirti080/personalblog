{% extends 'base.html' %}
{% block content %}
<h1>Your Dashboard</h1>
<a id="createPostBtn" class="btn" href="{{ url_for('create_post') }}">Create New Post</a>

<div class="dashboard">
{% for post in posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <div class="actions">
            <a href="{{ url_for('edit_post', post_id=post.id) }}">Edit</a>
            <a href="{{ url_for('view_post', post_id=post.id) }}">View</a>
            <a href="{{ url_for('delete_post', post_id=post.id) }}" onclick="return confirm('Are you sure you want to delete this post?');">Delete</a>
        </div>
        <span class="badge">Your Post</span>
    </div>
{% else %}
    <p>You haven't created any posts yet.</p>
{% endfor %}
</div>
{% endblock %}
